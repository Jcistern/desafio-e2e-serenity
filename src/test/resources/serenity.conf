webdriver {
    driver = chrome
    autodownload = true
    capabilities {
        browserName = "chrome",
        "goog:chromeOptions" {
        args = ["--incognito", "start-maximized", "no-sandbox", "ignore-certificate-errors", "disable-popup-blocking",
            "disable-default-apps", "disable-extensions-file-access-check", "disable-infobars"]
            prefs {
                default_content_settings.popups = 0,
                default_content_settings.geolocation = 2,
                credentials_enable_service = false,
                password_manager_enabled = false
            }
            excludeSwitches = ["enable-automation","load-extension"],
        }
    }
}

headless.mode = false

serenity {
    project.name = "Desafio E2E - Banca Ecuador"
    take.screenshots = FOR_EACH_ACTION
    report.dir = test-results/reports
    report.encoding = UTF-8
    test.root = src/test/java
    output.dir = test-results/output
}