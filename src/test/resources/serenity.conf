webdriver {
    driver = chrome
    autodownload = true
}

headless.mode = false

serenity {
    project.name = "Desafio E2E - Banca Ecuador"
    take.screenshots = FOR_EACH_ACTION
}

chrome.switches = "--no-sandbox;--disable-dev-shm-usage;--window-size=1920,1080;--disable-features=PasswordLeakDetection,PasswordManagerOnboarding;--password-store=basic"